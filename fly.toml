# fly.toml app configuration for django-lightning

app = "django-lightning"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # `uv` is not present in the runtime image; use the venv Python baked into the image.
  release_command = "python manage.py migrate --noinput"


[env]
  DJANGO_SETTINGS_MODULE = "config.settings"
  ALLOWED_HOSTS = ".fly.dev"
  DEBUG = "0"
  # SECRET_KEY, DATABASE_URL, REDIS_URL must be provided via `fly secrets set ...`
  # (the app refuses to boot with DEBUG=0 and an unset/placeholder SECRET_KEY).

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "2s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
