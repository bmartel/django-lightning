# fly.toml app configuration for django-lightning

app = "django-lightning"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "uv run manage.py migrate --noinput"


[env]
  DJANGO_SETTINGS_MODULE = "config.settings"
  ALLOWED_HOSTS = ".fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "2s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
