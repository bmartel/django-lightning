version: "3.8"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run manage.py migrate --noinput
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production-1234567890
      - DATABASE_URL=postgres://lightning:lightningpass@db:5432/lightningdb
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run manage.py runbolt --host 0.0.0.0 --port 8000 --dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production-1234567890
      - DATABASE_URL=postgres://lightning:lightningpass@db:5432/lightningdb
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run saq app.tasks.settings
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production-1234567890
      - DATABASE_URL=postgres://lightning:lightningpass@db:5432/lightningdb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lightning
      POSTGRES_PASSWORD: lightningpass
      POSTGRES_DB: lightningdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightning -d lightningdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
