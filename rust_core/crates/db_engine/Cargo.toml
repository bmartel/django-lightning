[package]
name = "db_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "time", "sync"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "chrono", "json"] }
