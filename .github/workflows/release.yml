name: Release CLI & Binary Assets

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-crates-io:
    name: Publish create-django-bolt to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path cli/Cargo.toml

  build-release-binaries:
    name: Build Cross-Platform Release Binaries
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: create-django-bolt-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: create-django-bolt-linux-arm64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: create-django-bolt-macos-arm64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: create-django-bolt-macos-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: create-django-bolt-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --manifest-path cli/Cargo.toml --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd cli/target/${{ matrix.target }}/release
          tar -czvf ../../../../${{ matrix.asset_name }} create-django-bolt

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd cli/target/${{ matrix.target }}/release
          7z a ../../../../${{ matrix.asset_name }} create-django-bolt.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
