name: Validate & Deploy Kubernetes Manifests

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'Dockerfile'
      - '.kube-linter.yaml'
  pull_request:
    paths:
      - 'k8s/**'
      - '.kube-linter.yaml'

jobs:
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate YAML Syntax
        run: |
          python3 -c "import yaml, glob; [yaml.safe_load_all(open(f)) for f in glob.glob('k8s/*.yaml')]; print('YAML syntax valid')"

      - name: Lint Kubernetes Manifests (kube-linter)
        uses: stackrox/kube-linter-action@v1
        with:
          directory: k8s
          config: .kube-linter.yaml
