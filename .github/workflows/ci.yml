name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lightning
          POSTGRES_PASSWORD: lightningpass
          POSTGRES_DB: lightningdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Build Native Extension
        run: |
          uv venv
          uv pip install maturin
          uv run maturin develop
          uv pip install -e ".[dev]"

      - name: Run Linting
        run: |
          uv run ruff check .

      - name: Run Tests
        env:
          SECRET_KEY: ci-secret-key-12345
          DATABASE_URL: postgres://lightning:lightningpass@localhost:5432/lightningdb
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest -v

      - name: Build Docker Image
        run: |
          docker build -t django-lightning:test .
