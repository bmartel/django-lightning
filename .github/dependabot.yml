version: 2
updates:
  # Maintain Python dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Rust CLI dependencies declared in cli/Cargo.toml
  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "weekly"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
