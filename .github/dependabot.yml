version: 2
updates:
  # Maintain Python dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Rust CLI dependencies declared in cli/Cargo.toml
  - package-ecosystem: "cargo"
    directory: "/cli"
    schedule:
      interval: "weekly"

  # Maintain Rust core workspace dependencies
  - package-ecosystem: "cargo"
    directory: "/rust_core/crates/rust_core_pyo3"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust_core/crates/db_engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust_core/crates/core_utils"
    schedule:
      interval: "weekly"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
