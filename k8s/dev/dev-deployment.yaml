apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-lightning-dev
  labels:
    app: django-lightning-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-lightning-dev
  template:
    metadata:
      labels:
        app: django-lightning-dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: api
        image: django-lightning:dev
        imagePullPolicy: Never
        command: ["uv", "run", "manage.py", "runbolt", "--host", "0.0.0.0", "--port", "8000", "--dev"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DEBUG
          value: "1"
        - name: SECRET_KEY
          value: "dev-secret-key-change-in-production-1234567890"
        - name: ALLOWED_HOSTS
          value: "*"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
