apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-lightning-worker
  labels:
    app: django-lightning
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-lightning
      component: worker
  template:
    metadata:
      labels:
        app: django-lightning
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - django-lightning
              topologyKey: kubernetes.io/hostname
      containers:
      - name: worker
        image: django-lightning:v1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        command: ["python", "-m", "saq", "app.tasks.settings"]
        envFrom:
        - configMapRef:
            name: django-lightning-config
        - secretRef:
            name: django-lightning-secret
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
      volumes:
      - name: tmp-volume
        emptyDir: {}
