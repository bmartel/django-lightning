[project]
name = "django-lightning"
version = "0.1.0"
description = "High-performance Agentic Django-Bolt starter template for production APIs, WebSockets, MCP, Docker, Kubernetes, and Fly.io"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0",
    "django-bolt>=0.7.0",
    "bolt-mcp>=0.1.0",
    "msgspec>=0.18.0",
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=3.1.2",
    "django-cors-headers>=4.9.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "saq>=0.26.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.maturin]
manifest-path = "rust_core/crates/rust_core_pyo3/Cargo.toml"
python-packages = ["app"]
module-name = "app.rust_core"

[project.optional-dependencies]
dev = [
    "maturin>=1.5.0",
    "mypy>=1.10.0",
    "django-stubs>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.12.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["app/migrations/.*"]

[tool.mypy_django_plugin]
ignore_missing_model_attributes = true

[tool.django-stubs]
django_settings_module = "config.settings"




[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/migrations/*" = ["E501"]

[tool.semantic_release]
version_variables = ["app/__init__.py:__version__", "cli/Cargo.toml:version"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = ""
